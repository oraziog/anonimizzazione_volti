# MinIO-based development/runtime setup for the S3 ingress/egress backend
# (feature `s3`). Spins up:
#   minio         the S3-compatible store (API :9000, console :9001)
#   minio-init    creates the three buckets (input / output / logs)
#   anonimizzazione-volti   the service built WITH `--features retraining,s3`
#
# Buckets stay PRIVATE: cameras/operators authenticate with SigV4 credentials
# (see scripts/s3_tools.sh / aws cli); no anonymous `mc policy set public`.
#
# Usage:
#   docker compose -f docker-compose.minio.yml up -d --build
#
# Then:
#   ./scripts/s3_tools.sh upload frame.zip camera_001.zip
#   curl -X POST localhost:8080/anonymize/s3 -H 'Content-Type: application/json' \
#        -d '{"input_key":"camera_001.zip"}'
#   curl -X POST localhost:8080/operator/s3/sweep -H 'X-Operator-Key: <key>' \
#        -H 'Content-Type: application/json' -d '{"prefix":"","max_files":50}'

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing myminio/anonimizzazione-input &&
      mc mb --ignore-existing myminio/anonimizzazione-output &&
      mc mb --ignore-existing myminio/anonimizzazione-logs &&
      echo 'buckets ready'
      "

  anonimizzazione-volti:
    build:
      context: .
      # retraining,s3 = the Dockerfile's `ARG FEATURES`
      args:
        FEATURES: retraining,s3
    image: anonimizzazione-volti-s3:latest
    container_name: anonimizzazione-volti-s3
    restart: unless-stopped
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Credentials for MinIO (the app only talks to S3 over HTTP here).
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      # Enable + configure the S3 backend.
      S3_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_INPUT: anonimizzazione-input
      S3_BUCKET_OUTPUT: anonimizzazione-output
      S3_BUCKET_LOGS: anonimizzazione-logs
      S3_MAX_CONCURRENT_JOBS: "2"
      # Completion webhooks are OFF unless an allowlist host is set (anti-SSRF).
      # S3_WEBHOOK_ALLOWED_HOSTS: "notifiche.internal:8443, altro.example"
      # No default on purpose: a known key would expose every operator route.
      # `docker compose up` now fails fast until you set a real one in .env.
      OPERATOR_API_KEY: "${OPERATOR_API_KEY:?OPERATOR_API_KEY is required - set a strong key in .env (see .env.example)}"
      RUST_LOG: info
    ports:
      - "8080:8080"
    volumes:
      - models:/app/models
      - data:/app/data
      - fp_crops:/app/dataset_falsi_positivi
      - seed:/app/dataset_seed
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  models:
  data:
  fp_crops:
  seed: