[package]
name = "anonimizzazione_volti"
version = "0.1.0"
edition = "2021"
description = "Industrial-grade batch face anonymization service (Rust + ONNX)"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
# Streaming the on-disk output ZIP back to the client (ReaderStream over a
# tokio::fs::File): the /anonymize response never buffers the archive in RAM.
tokio-util = { version = "0.7", features = ["io"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["download-binaries", "copy-dylibs", "std", "tls-rustls"] }
axum = { version = "0.7", features = ["multipart"] }
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio"] }
image = "0.24"
imageproc = "0.23"
zip = "2.0"
# liblzma bindings: already compiled into the tree by zip's `xz` feature;
# used as a robust fallback for LZMA-compressed ZIP entries (method 14) that
# the zip crate's pure-Rust lzma-rs decoder cannot handle (see zip_worker.rs).
xz2 = "0.1"
# Independent decoders used as fallbacks when the zip crate's own decode of a
# non-standard method (bzip2, zstd, XZ, deflate64) fails: re-read the raw
# entry and retry, verifying CRC32 + size (see read_entry_bytes).
bzip2 = "0.5"
zstd = "0.13"
deflate64 = "0.1"
# Non-ZIP archive ingestion: .7z (pure-Rust LZMA/LZMA2 via sevenz-rust) and
# .rar (unrar 0.5.8 — unrar_sys compiles the bundled unrar C++ source, no
# system library needed). Both decompress to a scratch dir under DATA_DIR and
# feed the same per-image pipeline.
sevenz-rust = "0.5"
unrar = "0.5"
# CRC32 for verifying fallback LZMA decodes against the entry's stored checksum.
crc32fast = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "json"] }
ndarray = "0.15"
geo = "0.28"
arc-swap = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
# EXIF metadata reader (pure Rust): with CAMERA_ID_SOURCE=exif the ingest path
# derives the camera id from the body serial number (tag 0xA431) instead of
# the filename/folder prefix, falling back to the layout when absent.
exif = { package = "kamadak-exif", version = "0.6" }
futures-util = "0.3"

pyo3 = { version = "0.21", features = ["auto-initialize"], optional = true }

# S3 ingress/egress backend (feature `s3`, spec §8 S3 integration): the AWS
# SDK for Rust with rustls + tokio. `behavior-version-latest` pins the AWS
# config global behavior to the latest SDK semantics instead of a frozen
# default. Gated like `retraining` so the default CPU build stays lean; the
# Docker images keep using the plain (local-disk) storage unless built with
# `--features s3`.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
# Unique keys / temp file names for S3 jobs (aza service already uses UUIDs
# in the database layer; this one is scoped to the S3 worker).
uuid = { version = "1", features = ["v4"], optional = true }
# SQS consumer (feature `queue`): long-polls a standard SQS queue for
# `{input_key, ...}` messages and drives each through the S3 worker — same
# pipeline, audit log and webhook as the HTTP/S3 paths. Gated like `s3`.
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }
# RabbitMQ consumer (feature `rabbitmq`): AMQP manual-ack consumer with retry
# backoff and a dead-letter queue. lapin 4 with the explicit `tokio` runtime
# feature; `rustls` + `rustls--ring` (portable crypto provider) so `amqps://`
# URLs work too.
lapin = { version = "4", default-features = false, features = ["tokio", "rustls", "rustls--ring"], optional = true }

[features]
default = []
# PyO3/Python retraining bridge (spec §6). Enabled by default in the Docker
# build (Dockerfile uses --features retraining with a Python 3.12 base image);
# keep it off for plain `cargo build` where no Python interpreter is present.
retraining = ["dep:pyo3"]
# GPU execution providers (ORT prebuilt binaries, CUDA 13 + cuDNN 9). Each
# needs the matching system runtime at deploy time; see Dockerfile.gpu and
# the README "Inference backend (GPU)" section. The plain CPU build stays the
# default (no GPU toolchain required to compile).
cuda = ["ort/cuda"]
tensorrt = ["ort/cuda", "ort/tensorrt"]
directml = ["ort/directml"]
# S3 ingestion/storage backend: async job intake from a bucket + streaming
# put/get of the anonymized archives, presigned download links, audit logs and
# optional completion webhooks. Requires the AWS SDK deps (compile-time cost is
# sizeable — keep off for the minimal CPU build).
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:uuid"]
# SQS async job intake: consumer that polls an SQS queue and reuses the S3
# worker (`s3` is implied — jobs are processed against the same buckets).
queue = ["dep:aws-sdk-sqs", "s3"]
# RabbitMQ async job intake: manual-ack consumer with retry backoff + DLQ,
# reusing the same S3 worker (`s3` implied).
rabbitmq = ["dep:lapin", "s3"]
