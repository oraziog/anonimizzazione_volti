name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build + test (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            features: ""
          - label: retraining
            features: retraining
    steps:
      - uses: actions/checkout@v4

      # Python 3.12: required to compile the PyO3 bridge when the
      # `retraining` feature is on (harmless for the default build).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.label }}

      - name: Build
        shell: bash
        env:
          PYO3_PYTHON: python
        run: |
          ARGS=""
          if [ -n "${{ matrix.features }}" ]; then
            ARGS="--features ${{ matrix.features }}"
          fi
          cargo build --locked --manifest-path src/Cargo.toml $ARGS

      - name: Run tests
        shell: bash
        env:
          PYO3_PYTHON: python
        run: |
          ARGS=""
          if [ -n "${{ matrix.features }}" ]; then
            ARGS="--features ${{ matrix.features }}"
          fi
          cargo test --locked --manifest-path src/Cargo.toml $ARGS
